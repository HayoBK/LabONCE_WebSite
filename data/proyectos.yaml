- titulo: "¿Es el Mareo Crónico un problema de Navegación Espacial?"
  descripcion: >-
    El Mareo Perceptual Postural Persistente (MPPP/PPPD) es la forma más frecuente de mareo
    crónico. Este proyecto evaluó los procesos de navegación espacial a nivel conductual
    (Morris Water Maze virtual e inmersivo), electrofisiológico (EEG durante navegación) y
    estructural (RNM), comparando pacientes con MPPP, controles sanos y otras causas de
    vértigo. Sus resultados dieron origen a las publicaciones en Brain Sciences 2024 y
    Frontiers in Neurology 2025, y a la propuesta del MPPP como una disfunción cognitiva
    viso-vestibular superior.
  financiamiento: "FONDECYT de Iniciación 11200469 — ANID"
  estado: "Investigación completada"
