<script>
// --- Menú móvil ---
(function(){
  var t = document.getElementById('lo-toggle');
  var m = document.getElementById('lo-menu');
  if(t && m){
    t.addEventListener('click', function(){
      var open = m.classList.toggle('is-open');
      t.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }
})();

// --- Canvas "equilibrio": red de nodos multicolor (motivo del cerebro arcoíris del logo) ---
(function(){
  var c = document.getElementById('lo-hero-canvas');
  if(!c) return;
  var ctx = c.getContext('2d');
  var COLORS = ['#E94B3C','#F58220','#F4C20D','#3BA55C','#19A8C4','#1D6FE0','#8E4FD0'];
  var nodes = [], W, H, raf;
  function resize(){
    W = c.width = c.offsetWidth; H = c.height = c.offsetHeight;
    nodes = [];
    var n = Math.max(26, Math.round(W/40));
    for(var i=0;i<n;i++){
      nodes.push({
        x:Math.random()*W, y:Math.random()*H,
        vx:(Math.random()-.5)*.3, vy:(Math.random()-.5)*.3,
        r:Math.random()*2+1,
        col:COLORS[i % COLORS.length]
      });
    }
  }
  function hex2rgba(hex,a){
    var v=parseInt(hex.slice(1),16);
    return 'rgba('+((v>>16)&255)+','+((v>>8)&255)+','+(v&255)+','+a+')';
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<nodes.length;i++){
      var p=nodes[i];
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;
      if(p.y<0||p.y>H)p.vy*=-1;
      for(var j=i+1;j<nodes.length;j++){
        var q=nodes[j], dx=p.x-q.x, dy=p.y-q.y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<130){
          ctx.strokeStyle='rgba(94,110,130,'+((1-d/130)*.22)+')';
          ctx.lineWidth=.7;
          ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
        }
      }
      ctx.fillStyle=hex2rgba(p.col,.8);
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }
    raf=requestAnimationFrame(draw);
  }
  resize(); draw();
  window.addEventListener('resize', function(){ cancelAnimationFrame(raf); resize(); draw(); });
})();

// --- Boletín (Brevo): envío AJAX + mensaje inline, sin salir del sitio ---
// Mejora progresiva: sin JS el form postea normal y abre la página de Brevo.
(function(){
  var forms = document.querySelectorAll('form[data-lo-suscribe]');
  if(!forms.length) return;
  forms.forEach(function(form){
    var msg = form.querySelector('[data-lo-msg]');
    var btn = form.querySelector('button[type="submit"]');
    var hp  = form.querySelector('input[name="email_address_check"]');
    var email = form.querySelector('input[name="EMAIL"]');
    form.addEventListener('submit', function(e){
      // Honeypot lleno => bot: simulamos OK y no enviamos nada.
      if(hp && hp.value){ e.preventDefault(); return; }
      if(!email || !email.checkValidity()){ return; } // deja que el navegador muestre el error nativo
      e.preventDefault();
      var data = new URLSearchParams();
      Array.prototype.forEach.call(form.elements, function(el){
        if(el.name && el.type !== 'submit') data.append(el.name, el.value || '');
      });
      if(btn){ btn.disabled = true; }
      if(msg){ msg.className = 'lo-suscribe-form__msg'; msg.textContent = 'Enviando…'; }
      fetch(form.action, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
        body: data.toString()
      }).then(function(){
        if(msg){ msg.textContent = form.getAttribute('data-ok') || '¡Listo! Revisa tu correo.'; msg.className = 'lo-suscribe-form__msg is-ok'; }
        form.reset();
      }).catch(function(){
        if(msg){ msg.textContent = form.getAttribute('data-err') || 'Hubo un problema. Inténtalo de nuevo.'; msg.className = 'lo-suscribe-form__msg is-err'; }
      }).then(function(){
        if(btn){ btn.disabled = false; }
      });
    });
  });
})();
</script>
