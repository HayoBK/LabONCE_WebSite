# ============================================================
# LAB ONCE — Configuración de Pages CMS (app.pagescms.org)
# Login con GitHub (cuenta HayoBK) → repo LabONCE_WebSite.
# Recomendación: apuntar el CMS a una rama de trabajo (no a main directamente).
# ============================================================

media:
  input: static/images
  output: /images

content:

  # ── Equipo (una página por persona, desde 2026-08) ────────────────────────
  # Antes vivía como lista en data/integrantes.yaml; ahora cada integrante
  # tiene su propia página en content/integrantes/, con su propia URL —
  # igual que "miembros" en el sitio de Neurosistemas.
  - name: integrantes
    label: Equipo
    type: collection
    path: content/integrantes
    filename: "{primary}.md"
    exclude: ["_index.md"]
    view:
      fields: [title, categoria, rol, weight]
      sort: [weight, title]
    fields:
      - { name: title, label: "Nombre", type: string }
      - { name: rol,   label: "Rol / cargo", type: string }
      - name: categoria
        label: "Categoría"
        type: select
        options:
          values:
            - { value: director, label: "Dirección" }
            - { value: activo,   label: "Colaborador activo" }
            - { value: alumno,   label: "Alumno activo" }
            - { value: egresado, label: "Alumno egresado" }
            - { value: anterior, label: "Colaborador anterior" }
      # Ordena dentro de cada categoría (no hay orden alfabético automático).
      # Sugerido: 100 dirección · 200s activos · 400s alumnos · 500s egresados
      # · 600s anteriores, dejando huecos para insertar gente después.
      - { name: weight, label: "Orden dentro de su categoría", type: number }
      - { name: foto,   label: "Foto (URL o imagen)", type: string, description: "Pega una URL o, una vez localizada, usa images/<archivo>." }
      - { name: orcid,  label: "ORCID iD (solo para el link del perfil — no activa sincronización)", type: string }
      - { name: bio,    label: "Biografía (una línea por punto)", type: string, list: true }
      - { name: draft,  label: "Borrador", type: boolean, default: false }
      - { name: body,   label: "Texto largo opcional (además de la bio en viñetas)", type: rich-text }

  # ── Publicaciones destacadas (vitrina con abstract, imagen, factor de impacto) ──
  - name: publicaciones
    label: Publicaciones destacadas
    type: file
    path: data/publicaciones_seleccionadas.yaml
    list: true
    fields:
      - { name: titulo,         label: "Título", type: string }
      - { name: revista,        label: "Revista", type: string }
      - { name: anio,           label: "Año", type: number }
      - { name: factor_impacto, label: "Factor de impacto (opcional)", type: string }
      - { name: link,           label: "Enlace al texto completo", type: string }
      - { name: imagen,         label: "Imagen (URL o imagen)", type: string }
      - { name: abstract,       label: "Resumen / abstract", type: text }

  # ── Proyectos ─────────────────────────────────────────────────────────────
  - name: proyectos
    label: Proyectos
    type: file
    path: data/proyectos.yaml
    list: true
    fields:
      - { name: titulo,        label: "Título", type: string }
      - { name: descripcion,   label: "Descripción", type: text }
      - { name: financiamiento, label: "Financiamiento (ej. FONDECYT 1234567)", type: string }
      - { name: estado,        label: "Estado (ej. Activo)", type: string }
      - { name: link,          label: "Enlace (opcional)", type: string }

  # ── ORCID — fuente de sincronización automática ───────────────────────────
  # Deliberadamente solo trae al director (ver la nota dentro del archivo).
  - name: orcid
    label: "ORCID — fuente de sincronización"
    type: file
    path: data/orcid.yaml
    fields:
      - name: miembros
        label: "Perfiles ORCID sincronizados"
        type: object
        list: true
        fields:
          - { name: nombre, label: "Nombre", type: string }
          - { name: orcid,  label: "ORCID iD (0000-0000-0000-0000)", type: string }
          - name: apellidos
            label: "Apellidos para resaltar en negrita"
            type: string
            list: true
      - name: opciones
        label: "Opciones"
        type: object
        fields:
          - { name: anio_minimo,      label: "No traer nada anterior a (0 = sin corte)", type: number }
          - { name: usar_crossref,    label: "Completar datos con Crossref", type: boolean }
          - { name: correo_contacto,  label: "Correo de contacto para las APIs", type: string }

  # ── Publicaciones — archivo histórico curado (no se toca por el robot) ────
  - name: publicaciones_historicas
    label: "Publicaciones — archivo histórico"
    type: file
    path: data/publicaciones_historicas.yaml
    list: true
    fields:
      - { name: anio,    label: "Año", type: number }
      - { name: cita,    label: "Cita completa (admite <b> e <i>)", type: text }
      - { name: revista, label: "Revista / volumen / páginas", type: string }
      - { name: doi,     label: "DOI (sin https://doi.org/)", type: string }

  # ── Blog unificado (noticias + clases/recursos docentes) ─────────────────
  - name: blog
    label: "Blog (noticias y clases)"
    type: collection
    path: content/blog
    filename: "{primary}.md"
    format: yaml-frontmatter
    exclude: ["_index.md"]
    fields:
      - { name: title, label: "Título", type: string }
      - { name: date,  label: "Fecha", type: date }
      - { name: image, label: "Imagen de portada (con video YouTube: https://i.ytimg.com/vi/<ID>/hqdefault.jpg)", type: string }
      - name: categorias
        label: "Categoría (noticias o clases)"
        type: select
        list: true
        options:
          values:
            - { value: noticias, label: "Noticias (Actualidad)" }
            - { value: clases,   label: "Clases / Recursos docentes" }
      - { name: tags,  label: "Etiquetas (ej: esenciales-de-vertigo, fisiologia-basica, clases-on-line, maniobras-y-terapias, seminarios-de-alumnos)", type: string, list: true }
      - { name: body,  label: "Contenido (para video: <div class=\"lo-video\"><iframe src=\"https://www.youtube.com/embed/<ID>\" allowfullscreen></iframe></div>)", type: rich-text }

  # ── Parámetros del sitio (marca, contacto, afiliaciones) ──────────────────
  - name: params
    label: Ajustes del sitio
    type: file
    path: config/_default/params.yaml
    fields:
      - name: brand
        label: "Marca"
        type: object
        fields:
          - { name: name,  label: "Nombre corto", type: string }
          - { name: full,  label: "Nombre completo", type: string }
          - { name: short, label: "Bajada", type: string }
      - { name: description, label: "Descripción del sitio", type: text }
      - name: contacto
        label: "Contacto"
        type: object
        fields:
          - { name: email,  label: "Email", type: string }
          - { name: ciudad, label: "Ciudad", type: string }
